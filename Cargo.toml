[package]
name = "uti260b-viewer"
version = "0.1.0"
edition = "2024"
description = "Independent Rust GUI + automation CLI for the UNI-T UTi260B+ thermal imager (TCP 9527 protocol)"
license = "MIT OR Apache-2.0"
default-run = "uti260b-viewer"

[dependencies]
arc-swap = "1.7"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.37"
jpeg-decoder = "0.3"
png = "0.18"
serde_json = "1"
socket2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
