[package]
name = "utitherm"
version = "0.1.0"
edition = "2024"
description = "Independent Rust GUI + automation CLI for UNI-T UTi_cmdsys thermal imagers (TCP 9527 protocol)"
license = "MIT OR Apache-2.0"
default-run = "utitherm-viewer"

[lib]
name = "utitherm"
path = "src/lib.rs"

[[bin]]
name = "utitherm-viewer"
path = "src/main.rs"

[[bin]]
name = "utitherm-cli"
path = "src/bin/utitherm-cli.rs"

[dependencies]
arc-swap = "1.7"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.37"
jpeg-decoder = "0.3"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
